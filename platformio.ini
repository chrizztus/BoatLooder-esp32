; PlatformIO project configuration
; https://docs.platformio.org/page/projectconf.html
;
; Open this directory in VS Code with the "PlatformIO IDE" extension.
; Build: pio run   Upload: pio run -t upload   Monitor: pio device monitor

[env:esp32dev]
; pioarduino fork of platform-espressif32 -- required for Arduino core 3.x
; (ledcAttachChannel() and friends do not exist in core 2.x)
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.38/platform-espressif32.zip
board = esp32dev
framework = arduino

board_build.f_cpu = 240000000L
; Dual OTA app slots (~1.9MB each), not huge_app's single 3MB slot --
; OTA needs somewhere to write the new image while the old one is still
; running. A named scheme bundled with the framework, not a custom CSV:
; Arduino IDE's Tools > Partition Scheme has the exact same option
; ("Minimal SPIFFS (1.9MB APP with OTA/190KB SPIFFS)"), so the bootstrap
; sketch in arduino/ota_bootstrap/ can match this byte-for-byte with a
; menu pick, no custom partition file to hand anyone. Current firmware is
; 1,171,024 bytes -- comfortable headroom in a 1.9MB slot. The small
; SPIFFS partition this scheme reserves is unused (nothing in this
; codebase touches SPIFFS/LittleFS) but harmless.
board_build.partitions = min_spiffs.csv

monitor_speed = 115200
monitor_filters = esp32_exception_decoder, time

build_flags =
    -DCORE_DEBUG_LEVEL=1
    ; Logger.h log level: 0=NONE 1=ERROR 2=WARN 3=INFO 4=DEBUG
    -DLOG_LEVEL=3

lib_deps =
    teemuatlut/TMCStepper @ ^0.7.3
    waspinator/AccelStepper @ ^1.64
